<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>דף תשלום - תיקון תאימות</title>

    <script type="text/javascript">
      window._atsc_paq = window._atsc_paq || [];
      var urlParams = new URLSearchParams(window.location.search);
      var urlEmail = urlParams.get("email");

      (function () {
        window._atsc_paq.push(["setCookieDomain", "atsc.activetrail.com"]);
        window._atsc_paq.push(["setSiteId", "c4f20e41-9e9b-48e7-a483-76ada61a6fbd"]);
        window._atsc_paq.push(["setTrackerUrl", "//atsc.activetrail.com/api/Track3"]);

        if (urlEmail) {
          window._atsc_paq.push(["setUserId", urlEmail]);
        }

        window._atsc_paq.push(["trackPageView"]);

        var atsc_d = document,
          atsc_g = atsc_d.createElement("script"),
          atsc_s = atsc_d.getElementsByTagName("script")[0];
        atsc_g.type = "text/javascript";
        atsc_g.async = true;
        atsc_g.defer = true;
        atsc_g.src = "//atsc.activetrail.com/Scripts/atsc3.min.js";
        atsc_s.parentNode.insertBefore(atsc_g, atsc_s);
      })();
    </script>
  </head>
  <body style="text-align: center; padding-top: 50px; font-family: Arial; background: #f4f4f4;">
    
    <div style="background: white; padding: 40px; display: inline-block; border-radius: 10px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);">
      <h2>סיום הזמנה: <span id="event-name-display">הופעה</span></h2>

      <div style="margin-bottom: 15px; text-align: right">
        <label>אימייל:</label><br />
        <input type="email" id="customer-email" placeholder="הכנס מייל" style="padding: 10px; width: 250px" />
      </div>

      <div style="margin-bottom: 25px; text-align: right">
        <label>כמות:</label><br />
        <select id="ticket-qty" style="padding: 10px; width: 274px">
          <option value="1">1 כרטיס</option>
          <option value="2">2 כרטיסים</option>
          <option value="3">3 כרטיסים</option>
        </select>
      </div>

      <button
        id="submit-order-btn"
        style="padding: 15px; width: 100%; background: #28a745; color: white; font-size: 18px; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s;"
      >
        שלם עכשיו
      </button>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const emailFromUrl = params.get("email") || "";
      const eventName = params.get("eventName") || "הופעה חיה";
      const pricePerTicket = parseFloat(params.get("price")) || 250;
      const extId = params.get("extId") || "ID-" + Date.now();

      window.onload = function () {
        if (emailFromUrl) {
          document.getElementById("customer-email").value = emailFromUrl;
        }
        document.getElementById("event-name-display").innerText = eventName;
      };

      // חיבור בטוח של אירוע הלחיצה, עוקף את בעיות הריאקט של CodeSandbox
      document.getElementById("submit-order-btn").addEventListener("click", function () {
        var btn = document.getElementById("submit-order-btn");
        var finalEmail = document.getElementById("customer-email").value.trim();
        var qty = parseInt(document.getElementById("ticket-qty").value);
        var totalToPay = qty * pricePerTicket;

        if (!finalEmail || !finalEmail.includes("@")) {
          btn.innerText = "❌ הזן אימייל תקין";
          btn.style.background = "#dc3545";
          setTimeout(() => { 
              btn.innerText = "שלם עכשיו"; 
              btn.style.background = "#28a745"; 
          }, 2000);
          return;
        }

        btn.innerText = "⏳ שולח נתונים...";
        btn.style.background = "#ffc107";
        btn.style.color = "black";
        btn.disabled = true;

        window._atsc_paq = window._atsc_paq || [];
        
        // שלב 1: רישום
        window._atsc_paq.push(["setUserId", finalEmail]);
        window._atsc_paq.push(["logRegisterUser", extId, "Checkout_Direct", finalEmail, "", { firstName: "Test" }]);
        window._atsc_paq.push(["trackPageView", "User_Registered"]);

        // שלב 2: תזמון קצר ושליחת ההזמנה
        setTimeout(function () {
          window._atsc_paq.push(["clearEcommerceCart"]);
          window._atsc_paq.push(["addEcommerceItem", "SKU-001", eventName, "Tickets", pricePerTicket, qty]);
          window._atsc_paq.push(["setCustomData", { email: finalEmail, quantity: qty }]);
          window._atsc_paq.push(["trackEcommerceCartUpdate", totalToPay]);

          const purchaseDate = Math.floor(Date.now() / 1000);
          var orderId = "ORD_" + Date.now();
          window._atsc_paq.push(["trackEcommerceOrder", orderId, totalToPay, totalToPay, 0, 0, 0, purchaseDate]);

          btn.innerText = "✅ נשלח בהצלחה!";
          btn.style.background = "#0d6efd";
          btn.style.color = "white";
          btn.disabled = false;
        }, 800);
      });
    </script>
  </body>
</html>
