<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script type='text/javascript'>
        var _atsc_paq = window._atsc_paq || [];
        (function () {
            var p = new URLSearchParams(window.location.search);
            _atsc_paq.push(['setCookieDomain', 'atsc.activetrail.com']);
            _atsc_paq.push(['setSiteId', 'c4f20e41-9e9b-48e7-a483-76ada61a6fbd']);
            _atsc_paq.push(['setTrackerUrl', '//atsc.activetrail.com/api/Track3']);
            if (p.get('email')) { _atsc_paq.push(['setUserId', p.get('email')]); }
            _atsc_paq.push(['trackPageView']);
            var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
            g.type='text/javascript'; g.async=true; g.defer=true; g.src='//atsc.activetrail.com/Scripts/atsc3.min.js';
            s.parentNode.insertBefore(g,s);
        })();
    </script>
</head>
<body style="font-family: Arial; text-align: center; padding: 50px;">
    <h1>בדיקת זרימת אוטומציה - אקטיב טרייל</h1>
    
    <button onclick="identifyUser()" style="display:block; width:200px; margin:10px auto; padding:15px; background:blue; color:white;">1. בצע כניסה (Login)</button>
    <button onclick="addToCart()" style="display:block; width:200px; margin:10px auto; padding:15px; background:orange; color:white;">2. הוסף כרטיסים לסל</button>
    <button onclick="completePurchase()" style="display:block; width:200px; margin:10px auto; padding:15px; background:green; color:white;">3. בצע רכישה סופית</button>

    <script>
        // 1. זיהוי משתמש
        function identifyUser() {
            var email = new URLSearchParams(window.location.search).get('email') || "test@test.com";
            _atsc_paq.push(['setUserId', email]);
            alert("שלב 1: המשתמש " + email + " זוהה במערכת");
        }

        // 2. עדכון סל קניות (טריגר לעגלה נטושה באקטיב טרייל)
        function addToCart() {
            _atsc_paq.push(['trackEcommerceCartUpdate', 150]); 
            alert("שלב 2: הכרטיסים נוספו לסל (150 ש''ח)");
        }

        // 3. ביצוע רכישה (טריגר לסיום רכישה באקטיב טרייל)
        function completePurchase() {
            var orderId = 'ORD-' + Date.now();
            var price = 150;

            // שליחת פריט ספציפי (חשוב לאוטומציה לפי מוצר)
            _atsc_paq.push(['addEcommerceItem', 'SKU-TICKET', 'כרטיס להופעה', 'כרטיסים', price, 1]);
            
            // שליחת ההזמנה הכוללת
            _atsc_paq.push(['trackEcommerceOrder', orderId, price]);

            alert("שלב 3: הרכישה הושלמה בהצלחה!\nמספר הזמנה: " + orderId);
        }
    </script>
</body>
</html>
