<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script type='text/javascript'>
        var _atsc_paq = window._atsc_paq || [];
        (function () {
            _atsc_paq.push(['setCookieDomain', 'atsc.activetrail.com']);
            _atsc_paq.push(['setSiteId', 'c4f20e41-9e9b-48e7-a483-76ada61a6fbd']);
            _atsc_paq.push(['setUserId', '_atscid']); 
            _atsc_paq.push(['setTrackerUrl', '//atsc.activetrail.com/api/Track3']);
            _atsc_paq.push(['trackPageView']);

            var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
            g.type='text/javascript'; g.async=true; g.defer=true; g.src='//atsc.activetrail.com/Scripts/atsc3.min.js';
            s.parentNode.insertBefore(g,s);
        })();
    </script>
</head>
<body style="font-family: Arial; text-align: center; padding: 50px; background-color: #f4f7f6;">

    <div style="background: white; border: 1px solid #ddd; padding: 30px; width: 350px; margin: 0 auto; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <h2 style="margin-top: 0; color: #333;">רכישת כרטיס</h2>
        
        <div style="margin-bottom: 25px; text-align: right;">
            <label for="orderEmail" style="font-size: 14px; font-weight: bold; color: #555;">אימייל לזיהוי וקבלת הכרטיס:</label>
            <input type="email" id="orderEmail" placeholder="your@email.com" 
                   style="width: 100%; padding: 12px; border: 2px solid #007bff; border-radius: 8px; box-sizing: border-box; margin-top: 5px; font-size: 16px;">
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <p style="color: #666; margin-bottom: 5px;">כרטיס הופעה חיה</p>
        <div style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">
            <span id="livePrice" style="color: #28a745;">150</span> ₪
        </div>
        
        <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 25px;">
            <button onclick="updateQty(-1)" style="width: 40px; height: 40px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 5px;">-</button>
            <input type="number" id="qtyInput" value="1" readonly style="width: 50px; text-align: center; font-size: 20px; border: none; font-weight: bold;">
            <button onclick="updateQty(1)" style="width: 40px; height: 40px; cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 5px;">+</button>
        </div>

        <button onclick="addToCart()" style="width: 100%; padding: 15px; background: #ff9900; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; margin-bottom: 10px;">הוספה לסל</button>
        <button id="buyBtn" onclick="completePurchase()" style="width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; display: none;">בצע רכישה סופית</button>
    </div>

    <script>
        const PRICE_PER_UNIT = 150;
        let currentQty = 1;

        // טעינה אוטומטית של המייל מהזיכרון
        window.onload = function() {
            const savedEmail = localStorage.getItem('user_email');
            if (savedEmail) {
                document.getElementById('orderEmail').value = savedEmail;
            }
        }

        function updateQty(change) {
            let newQty = currentQty + change;
            if (newQty >= 1 && newQty <= 10) {
                currentQty = newQty;
                document.getElementById('qtyInput').value = currentQty;
                document.getElementById('livePrice').innerText = currentQty * PRICE_PER_UNIT;
            }
        }

    function addToCart() {
    let email = document.getElementById('orderEmail').value;
    if (!email.includes('@')) {
        alert("נא להזין מייל תקין");
        return;
    }
    
    localStorage.setItem('user_email', email);
    let finalTotal = currentQty * PRICE_PER_UNIT;

    // שימוש ב-Tracker החדש
    tracker.addEcommerceItem('TICKET-100', 'כרטיס הופעה', 'כרטיסים', PRICE_PER_UNIT, currentQty);
    tracker.trackEcommerceCartUpdate(finalTotal);
    
    document.getElementById('buyBtn').style.display = 'block';
    console.log("Cart updated for: " + email);
}

function completePurchase() {
    let emailValue = document.getElementById('orderEmail').value;
    let finalTotal = currentQty * PRICE_PER_UNIT;
    let orderId = 'ORD-' + Date.now();

    // 1. זיהוי משתמש
    tracker.logRegisterUser(emailValue);

    // 2. הוספת פריט להזמנה
    tracker.addEcommerceItem('TICKET-100', 'כרטיס הופעה', 'כרטיסים', PRICE_PER_UNIT, currentQty);
    
    // 3. שליחת ההזמנה הסופית
    tracker.trackEcommerceOrder(orderId, finalTotal, finalTotal, 0, 0, 0);

    alert("הרכישה הושלמה! Tracker שלח את כל הנתונים.");
}
    </script>
</body>
</html>
