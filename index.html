<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script type='text/javascript'>
        var _atsc_paq = window._atsc_paq || [];
        (function () {
            _atsc_paq.push(['setCookieDomain', 'atsc.activetrail.com']);
            _atsc_paq.push(['setSiteId', 'c4f20e41-9e9b-48e7-a483-76ada61a6fbd']);
            _atsc_paq.push(['setUserId', '_atscid']); 
            _atsc_paq.push(['setTrackerUrl', '//atsc.activetrail.com/api/Track3']);
            _atsc_paq.push(['trackPageView']);
            var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
            g.type='text/javascript'; g.async=true; g.defer=true; g.src='//atsc.activetrail.com/Scripts/atsc3.min.js';
            s.parentNode.insertBefore(g,s);
        })();
    </script>
</head>
<body style="font-family: Arial; text-align: center; padding: 50px; background-color: #f9f9f9;">

    <div style="background: white; border: 1px solid #ddd; padding: 30px; width: 300px; margin: 0 auto; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2 style="margin-top: 0;">כרטיס להופעה</h2>
        <p style="color: #666;">מחיר ליחידה: 150 ש"ח</p>
        
        <div style="display: flex; align-items: center; justify-content: center; margin: 25px 0;">
            <button onclick="updateQty(-1)" style="width: 45px; height: 45px; font-size: 24px; cursor: pointer; border: 1px solid #ccc; background: #eee; border-radius: 5px;">-</button>
            <input type="number" id="qtyInput" value="1" min="1" max="10" readonly style="width: 60px; text-align: center; font-size: 20px; border: none; font-weight: bold;">
            <button onclick="updateQty(1)" style="width: 45px; height: 45px; font-size: 24px; cursor: pointer; border: 1px solid #ccc; background: #eee; border-radius: 5px;">+</button>
        </div>

        <div style="font-size: 22px; margin-bottom: 20px;">
            סה"כ לתשלום: <span id="livePrice" style="color: #28a745; font-weight: bold;">150</span> ₪
        </div>
        
        <button onclick="addToCart()" style="width: 100%; padding: 15px; background: #ff9900; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold;">הוספה לסל</button>
        <button id="buyBtn" onclick="completePurchase()" style="width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 10px; display: none;">בצע רכישה</button>
    </div>

    <script>
        const PRICE_PER_UNIT = 150;
        let currentQty = 1;

        // עדכון המחיר בלייב
        function updateQty(change) {
            let newQty = currentQty + change;
            if (newQty >= 1 && newQty <= 10) {
                currentQty = newQty;
                document.getElementById('qtyInput').value = currentQty;
                document.getElementById('livePrice').innerText = currentQty * PRICE_PER_UNIT;
            }
        }

        function addToCart() {
            let finalTotal = currentQty * PRICE_PER_UNIT;
            _atsc_paq.push(['trackEcommerceCartUpdate', finalTotal]);
            
            document.getElementById('buyBtn').style.display = 'block';
            alert("הסל עודכן: " + currentQty + " כרטיסים ב-" + finalTotal + " ש\"ח");
        }

        function completePurchase() {
            let finalTotal = currentQty * PRICE_PER_UNIT;
            let orderId = 'ORD-' + Date.now();

            _atsc_paq.push(['addEcommerceItem', 'TICKET-100', 'כרטיס הופעה', 'כרטיסים', PRICE_PER_UNIT, currentQty]);
            _atsc_paq.push(['trackEcommerceOrder', orderId, finalTotal]);

            alert("בוצע! פופ-אפ אישור: נרכשו " + currentQty + " כרטיסים.");
            document.getElementById('buyBtn').style.display = 'none';
        }
    </script>
</body>
</html>
