<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>בדיקת פיקסל - Get Color It</title>
    <script type='text/javascript'>
        var _atsc_paq = window._atsc_paq || [];
        (function () {
            var p = new URLSearchParams(window.location.search);
            _atsc_paq.push(['setCookieDomain', 'atsc.activetrail.com']);
            _atsc_paq.push(['setSiteId', 'c4f20e41-9e9b-48e7-a483-76ada61a6fbd']);
            _atsc_paq.push(['setTrackerUrl', '//atsc.activetrail.com/api/Track3']);
            if (p.get('email')) { _atsc_paq.push(['setUserId', p.get('email')]); }
            _atsc_paq.push(['trackPageView']);
            var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
            g.type='text/javascript'; g.async=true; g.defer=true; g.src='//atsc.activetrail.com/Scripts/atsc3.min.js';
            s.parentNode.insertBefore(g,s);
        })();
    </script>
</head>
<body style="font-family: Arial; text-align: center; padding-top: 100px;">
    <h1>הדף של ענבר - בדיקת פיקסל</h1>
    <button id="btn" style="padding: 20px 50px; font-size: 20px; background: green; color: white; border: none; cursor: pointer; border-radius: 10px;">שלם עכשיו ובדוק פיקסל</button>
    
    <script>
        document.getElementById('btn').onclick = function() {
            var p = new URLSearchParams(window.location.search);
            var email = p.get('email') || "test@test.com";
            _atsc_paq.push(['setUserId', email]);
            _atsc_paq.push(['trackEcommerceOrder', 'ORD-' + Date.now(), 250]);
            
            this.innerText = "שולח נתונים...";
            setTimeout(function() {
                window.location.href = "https://getcolorit.com";
            }, 1000);
        };
    </script>
</body>
</html>
